name: LDM - Desplegar API Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/api/**'
      - '.github/workflows/deploy-ldm-api.yml'

permissions:
  contents: read

concurrency:
  group: ldm-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Primer despliegue manual. Automático solo después de habilitar la variable del repositorio.
    if: github.event_name == 'workflow_dispatch' || vars.LDM_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar JavaScript
        run: node --check workers/api/worker.js

      - name: Preparar configuración segura
        env:
          KV_ID: ${{ vars.LDM_KV_NAMESPACE_ID }}
          KV_SECRET: ${{ secrets.LDM_KV_NAMESPACE_ID }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib, sys
          root=pathlib.Path('workers/api')
          raw_var=os.environ.get('KV_ID','').strip()
          raw_secret=os.environ.get('KV_SECRET','').strip()
          kv=raw_var or raw_secret
          print('Diagnóstico KV: variable de repositorio presente:', 'SÍ' if raw_var else 'NO')
          print('Diagnóstico KV: secret alternativo presente:', 'SÍ' if raw_secret else 'NO')
          print('Diagnóstico KV: longitud del ID recibido:', len(kv))
          if not kv:
              sys.exit('ERROR: GitHub no recibe LDM_KV_NAMESPACE_ID. Comprueba Settings > Secrets and variables > Actions > Variables del repositorio liga-deportiva-militar (no de otro repositorio ni Environment).')
          if not re.fullmatch(r'[a-fA-F0-9]{32}',kv):
              sys.exit('ERROR: LDM_KV_NAMESPACE_ID existe, pero no son 32 caracteres hexadecimales. Copia Namespace ID de Cloudflare KV > ldm-datos, sin espacios ni comillas.')
          if not os.environ.get('CF_ACCOUNT','').strip() or not os.environ.get('CF_TOKEN','').strip():
              sys.exit('ERROR: Faltan CLOUDFLARE_ACCOUNT_ID o CLOUDFLARE_API_TOKEN en Secrets de GitHub.')
          source=(root/'worker.js').read_text()
          if 'ct-campeador' in source.lower() and ('https://ct-campeador' in source.lower() or 'ct-campeador:' in source.lower()):
              sys.exit('ERROR: Posible dependencia con CT Campeador detectada.')
          template=(root/'wrangler.toml.template').read_text()
          (root/'wrangler.toml').write_text(template.replace('__LDM_KV_ID__',kv))
          print('Comprobación correcta: Worker ldm-api, KV DATA propio y secretos presentes.')
          PY

      - name: Desplegar exclusivamente ldm-api
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy

      # El despliegue se valida por el exit code de wrangler-action.
      # /health puede devolver 403 a las IP de runners GitHub aun estando accesible en navegador.
      # Esta comprobacion remota informa, pero no convierte un despliegue correcto en fallo.
      - name: Comprobar health (diagnostico no bloqueante)
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PYHEALTH'
          import urllib.request, urllib.error, json
          url = 'https://ldm-api.ligasdetenis.workers.dev/health'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'LDM-GitHubActions-healthcheck/1.0', 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.load(resp)
              if data.get('ok') is True and data.get('service') == 'ldm-api' and data.get('version') == '0.3.0':
                  print('OK: API ldm-api v0.3.0 accesible desde GitHub Actions.')
              else:
                  print('::warning::Despliegue realizado pero /health no devuelve los datos esperados. Revisar manualmente en navegador.')
          except urllib.error.HTTPError as exc:
              print(f'::warning::No se pudo verificar /health desde GitHub (HTTP {exc.code}). Comprueba manualmente la version; esto NO implica fallo del despliegue.')
          except Exception as exc:
              print(f'::warning::No se pudo verificar /health desde GitHub ({type(exc).__name__}). Comprueba manualmente la version.')
          PYHEALTH
